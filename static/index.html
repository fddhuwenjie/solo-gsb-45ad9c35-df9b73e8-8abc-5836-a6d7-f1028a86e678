<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公交时刻换乘规划台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>🚌 公交时刻换乘规划台</h1>
      <p class="subtitle">时间依赖图搜索 · 步行换乘约束 · 停运跳站与区段截断 · 字典序稳定取解</p>
    </div>
  </header>

  <main class="layout">
    <!-- ================= 左栏：数据录入 ================= -->
    <section class="column inputs">
      <div class="toolbar">
        <button id="btn-sample" type="button">载入示例数据</button>
        <button id="btn-clear" type="button" class="ghost">清空全部</button>
        <button id="btn-export" type="button" class="ghost">导出 JSON</button>
        <button id="btn-import" type="button" class="ghost">导入 JSON</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden />
      </div>

      <div class="card">
        <div class="card-head">
          <h2>① 站点</h2>
          <span class="hint" id="count-stations"></span>
        </div>
        <div id="stations-list" class="rows"></div>
        <button class="add" data-add="station" type="button">＋ 添加站点</button>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>② 线路班次（带发车时刻）</h2>
          <span class="hint">经停格式：站点ID HH:MM，时刻须严格递增</span>
        </div>
        <div id="trips-list" class="rows"></div>
        <button class="add" data-add="trip" type="button">＋ 添加班次</button>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>③ 站内 / 站间步行换乘</h2>
          <span class="hint">双向生效，换乘前必须走满步行时间</span>
        </div>
        <div id="transfers-list" class="rows"></div>
        <button class="add" data-add="transfer" type="button">＋ 添加步行换乘</button>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>④ 临时停运区间</h2>
          <span class="hint">站点停运＝跳站通过；整线停运＝跳过整班；区段停运＝最远坐到封锁段前</span>
        </div>
        <div id="suspensions-list" class="rows"></div>
        <button class="add" data-add="suspension" type="button">＋ 添加停运区间</button>
      </div>
    </section>

    <!-- ================= 右栏：规划与结果 ================= -->
    <section class="column planner">
      <div class="card plan-card">
        <h2>⑤ 行程规划</h2>
        <div class="plan-grid">
          <label>起点站
            <select id="q-origin"></select>
          </label>
          <label>终点站
            <select id="q-destination"></select>
          </label>
          <label>最早出发时刻
            <input id="q-earliest" type="time" value="08:00" />
          </label>
          <label>偏好
            <select id="q-preference">
              <option value="fastest">最快到达</option>
              <option value="transfers">最少换乘</option>
              <option value="walking">最少步行</option>
            </select>
          </label>
        </div>
        <button id="btn-plan" type="button" class="primary">规划行程</button>
        <span id="recalc-hint" class="recalc-hint" hidden>输入已变更，结果待重算…</span>
      </div>

      <div class="card result-card">
        <h2>⑥ 规划结果</h2>
        <div id="result">
          <p class="empty">录入站点与班次后点击「规划行程」。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    Flask + 原生 JavaScript · 所有计算在后端时间依赖图上完成
  </footer>

  <script src="app.js"></script>
</body>
</html>
